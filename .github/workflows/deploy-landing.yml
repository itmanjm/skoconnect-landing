name: Deploy Landing

# Auto-deploy to Firebase Hosting on merge to main. PRs get build verification only.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-landing.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'public/**'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true  # Static site deploys are atomic — safe to cancel

jobs:
  build-verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node LTS
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # GA4 ID comes from the repo secret at build time (never hardcoded).
      # On PRs from forks this resolves empty — the GA4 component is env-gated, build still passes.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA4_ID: ${{ secrets.NEXT_PUBLIC_GA4_ID }}

  deploy:
    name: Deploy to Firebase Hosting
    needs: build-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node LTS
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA4_ID: ${{ secrets.NEXT_PUBLIC_GA4_ID }}

      - name: Write GCP service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-sa-key.json

      - name: Deploy to Production
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa-key.json
        run: npx firebase-tools deploy --only hosting:skoconnect --project school-connect-enterprise --non-interactive

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json
